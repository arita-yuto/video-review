name: Build a Docker image
description: Builds one image from the matrix and, when asked, pushes it to ghcr

inputs:
  name:
    description: Image name, used as the last segment of the ghcr path
    required: true
  dockerfile:
    description: Path to the Dockerfile
    required: true
  version:
    description: Tag to publish, such as v0.1.0. Leave empty to build without pushing
    required: false
    default: ""
  github-token:
    description: Token with packages:write, only needed when publishing
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to ghcr
      if: inputs.version != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build ${{ inputs.name }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.version != '' }}
        tags: ${{ inputs.version != '' && format('ghcr.io/{0}/{1}:{2},ghcr.io/{0}/{1}:latest', github.repository, inputs.name, inputs.version) || '' }}
        provenance: false
