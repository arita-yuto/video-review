name: pr-check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Build checks only; the image job builds without pushing.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          CI_BUILD: true

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-cli
      - uses: $/.github/actions/build-launcher

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: videoreview-runtime
            dockerfile: docker/web/Dockerfile
          - name: videoreview
            dockerfile: docker/web/Dockerfile.prod
          - name: video-processing
            dockerfile: docker/video-processing/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-images
        with:
          name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}

  lockfile:
    name: Actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Fails when a workflow's uses: and actions.lock disagree; `gh actions-lock` regenerates the lockfile.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
