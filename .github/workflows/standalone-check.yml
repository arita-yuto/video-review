name: standalone-check

# Runs the release bundle job without a tag, to check it before release.yml does.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: videoreview
          POSTGRES_PASSWORD: videoreview
          POSTGRES_DB: videoreview
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://videoreview:videoreview@127.0.0.1:5432/videoreview' || 'postgresql://postgres:root@127.0.0.1:5432/postgres' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-bundle
        with:
          version: v0.0.0-check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: video-review-${{ runner.os }}-x64
          path: dist/*.zip
          retention-days: 3
