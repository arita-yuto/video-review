name: release

on:
  push:
    tags: ["v*"]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # web-runtime is the development base image, built from compose; nobody pulls it.
          - name: videoreview
            dockerfile: docker/web/Dockerfile.prod
          - name: video-processing
            dockerfile: docker/video-processing/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-images
        with:
          name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}
          version: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  dockerhub-overview:
    runs-on: ubuntu-latest
    needs: images
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: videoreview
            description: Self-hosted, on-premise alternative to Frame.io for game and video teams
          - name: video-processing
            description: Thumbnail and transcode worker for VideoReview, a self-hosted Frame.io alternative
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./README.md
          # Docker Hub resolves no relative links, so ./documents/... become links into the GitHub repository.
          enable-url-completion: true

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-cli
        with:
          package: "true"
          version: ${{ github.ref_name }}
      - uses: $/.github/actions/build-launcher
        with:
          package: "true"
      - name: Attach the binaries to the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            maintenance/dist/*
            integrations/launcher/dist/*.zip
          # GitHub writes the body from the pull request titles merged since the last tag.
          generate_release_notes: true
          # upgrade and the release notice skip pre-releases unless asked for them.
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

  bundle:
    # The cli job creates the release; attaching after it keeps two jobs from creating it at once.
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    services:
      postgres:
        # An empty image skips the service on Windows, which starts its own PostgreSQL.
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: videoreview
          POSTGRES_PASSWORD: videoreview
          POSTGRES_DB: videoreview
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      # The Windows image ships PostgreSQL with the superuser password "root".
      DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgresql://videoreview:videoreview@127.0.0.1:5432/videoreview' || 'postgresql://postgres:root@127.0.0.1:5432/postgres' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/build-bundle
        with:
          version: ${{ github.ref_name }}
      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*.zip
