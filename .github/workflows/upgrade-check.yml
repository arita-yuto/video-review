name: upgrade-check

# Throwaway: runs local-guide's download commands as written, in PowerShell 7 and Windows PowerShell.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Download as the guide says
        run: |
          New-Item -ItemType Directory videoreview | Out-Null
          Set-Location videoreview
          curl.exe -L -o video-review-cli.exe https://github.com/arita-yuto/video-review/releases/latest/download/video-review-cli-windows-amd64.exe
          curl.exe -L -o .env https://raw.githubusercontent.com/arita-yuto/video-review/main/.example.env
          Get-ChildItem -Force | Format-Table Name, Length
          Select-String -Path .env -Pattern '^(DATABASE_URL|VIDEO_REVIEW_LOCAL_ROOTDIR)='
          ./video-review-cli.exe 2>&1 | Select-Object -First 3
          "cli exit: $LASTEXITCODE"
