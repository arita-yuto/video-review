name: upgrade-check

# Throwaway: the install folder's video-review-cli.exe upgrades an empty install and replaces itself on Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: maintenance/go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $name = (Get-Service postgresql*).Name
          Set-Service $name -StartupType Manual
          Start-Service $name

      - name: Upgrade with the install folder's CLI
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/install"
          mkdir -p "$install_dir/releases"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$install_dir/.env"
          (cd maintenance && go build -o "$install_dir/video-review-cli.exe" .)
          sha256sum "$install_dir/video-review-cli.exe"

          cd "$install_dir"
          ./video-review-cli.exe upgrade --prerelease
          echo "exit: $?"

          ls
          tag=$(cat current)
          sha256sum video-review-cli.exe video-review-cli.exe.old "releases/$tag/video-review-cli.exe"
          if cmp -s video-review-cli.exe "releases/$tag/video-review-cli.exe"; then echo "ok: the install folder's CLI is $tag's"; else echo "the install folder's CLI was not replaced"; exit 1; fi

          ./video-review-cli.exe stop
          curl -s -o /dev/null -w "after stop: %{http_code}\n" http://127.0.0.1:3489/api/v1/version || true
