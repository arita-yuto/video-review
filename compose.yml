services:
  web:
    env_file:
      - .env
    build: 
        context: ./
        dockerfile: ./docker/web/Dockerfile
    container_name: videoreview-web
    # Run as the host user so files generated into the bind mount stay writable on the host.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3489:3489"
    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /app/uploads
    volumes:
      - .:/app
      - videoreview-storage:/app/uploads
      # If you want to specify Local Storage
      # - /mnt/d/data/videoreview:/storage
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: videoreview-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: videoreview
      POSTGRES_PASSWORD: videoreview
      POSTGRES_DB: videoreview
    volumes:
      - videoreview-db:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: videoreview-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./llm_models:/root/.ollama/models

  video-processing:
    env_file:
      - .env
    build:
      context: ./
      dockerfile: ./docker/video-processing/Dockerfile
    container_name: videoreview-video-processing
    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /app/uploads
    volumes:
      - videoreview-storage:/app/uploads
      # If you want to specify Local Storage
      # - /mnt/d/data/videoreview:/storage
    depends_on:
      - db

  localstack:
      env_file:
        - .env
      image: localstack/localstack:latest
      container_name: "videoreview-localstack"
      depends_on:
          - web
      ports:
          - "4566:4566"
      environment:
          # https://docs.localstack.cloud/references/configuration/
          - DEBUG=${DEBUG:-0}
      volumes:
          - ./docker/localstack:/etc/localstack/init/ready.d

  nextcloud-db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - nextcloud-db:/var/lib/mysql

  nextcloud-data:
    image: nextcloud:29
    restart: always
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 nextcloud-data"
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      - nextcloud-db

  smtp:
    image: boky/postfix
    container_name: videoreview-smtp
    environment:
      HOSTNAME: "videoreview.local"
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      ALLOWED_NETWORKS: "0.0.0.0/0"
      RELAYHOST: ""
      RELAYHOST_USERNAME: ""
      RELAYHOST_PASSWORD: ""
    ports:
      - "1025:25"

volumes:
  videoreview-db:
  videoreview-storage:
  nextcloud-db:
  nextcloud-data:
