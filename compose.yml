services:
  web:
    # Optional: settings live in the admin screen; a .env only overrides them.
    env_file:
      - path: .env
        required: false
    build: 
        context: ./
        dockerfile: ./docker/web/Dockerfile
    container_name: videoreview-web
    # Run as the host user so files generated into the bind mount stay writable on the host.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3489:3489"
    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /app/uploads
    volumes:
      - .:/app
      - videoreview-storage:/app/uploads
      # If you want to specify Local Storage
      # - /mnt/d/data/videoreview:/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: videoreview-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: videoreview
      POSTGRES_PASSWORD: videoreview
      POSTGRES_DB: videoreview
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "videoreview", "-d", "videoreview"]
      interval: 2s
      retries: 30
    volumes:
      - videoreview-db:/var/lib/postgresql/data

  # Only with --profile keycloak: an identity provider to try the SSO login against.
  # The realm, a client and a test user come from docker/keycloak/realm.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: videoreview-keycloak
    profiles: [keycloak]
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser reaches Keycloak at this address; the web container reaches it as keycloak:8080.
      KC_HOSTNAME: http://127.0.0.1:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  # Only with --profile ollama; the image is large and most development does not need it.
  ollama:
    image: ollama/ollama:latest
    container_name: videoreview-ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ./llm_models:/root/.ollama/models

  video-processing:
    env_file:
      - path: .env
        required: false
    build:
      context: ./
      dockerfile: ./docker/video-processing/Dockerfile
    container_name: videoreview-video-processing
    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /app/uploads
    volumes:
      - videoreview-storage:/app/uploads
      # If you want to specify Local Storage
      # - /mnt/d/data/videoreview:/storage
    depends_on:
      db:
        condition: service_healthy

  # Only with --profile s3: a local AWS (S3 and Lambda) for the s3 storage driver.
  # create-bucket.sh makes the bucket from .env; deploy-lambda.sh deploys video-processing-lambda.zip
  # (npm run video-processing:package-lambda) as the upload trigger, so stop the video-processing container then.
  ministack:
    profiles: [s3]
    env_file:
      - path: .env
        required: false
    build:
      context: ./docker/ministack
    container_name: videoreview-ministack
    ports:
      - "4566:4566"
    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
    volumes:
      - ./docker/ministack:/docker-entrypoint-initaws.d/ready.d
      - ./integrations/video-processing:/lambda:ro
    depends_on:
      db:
        condition: service_healthy

  # Only with --profile nextcloud: the Nextcloud storage driver's test target.
  nextcloud-db:
    profiles: [nextcloud]
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - nextcloud-db:/var/lib/mysql

  nextcloud-data:
    profiles: [nextcloud]
    image: nextcloud:29
    restart: always
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 nextcloud-data"
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      - nextcloud-db

  # Only with --profile smtp: a relay for the email integration.
  smtp:
    image: boky/postfix
    container_name: videoreview-smtp
    profiles: [smtp]
    environment:
      HOSTNAME: "videoreview.local"
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAYHOST_PASSWORD:-}
    ports:
      - "1025:25"

volumes:
  videoreview-db:
  videoreview-storage:
  nextcloud-db:
  nextcloud-data:
