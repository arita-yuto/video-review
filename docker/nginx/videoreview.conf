# TLS in front of VideoReview. The app itself keeps speaking http; the forwarded headers tell it the public address.
# WebSocket upgrades pass through; Next's hot reload uses one in development.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream videoreview {
    # In compose the app is reached by its service name; an nginx on the same machine as `npm run start` uses 127.0.0.1:3489.
    server videoreview:3489;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Uploads are whole videos.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://videoreview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Video streams and long uploads pass straight through instead of being spooled.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
