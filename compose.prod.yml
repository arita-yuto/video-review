services:
  videoreview:
    # Optional: settings live in the admin screen; a .env only overrides them.
    env_file:
      - path: .env
        required: false

    image: ghcr.io/arita-yuto/video-review/videoreview:${VIDEO_REVIEW_VERSION:-latest}
    container_name: videoreview
    restart: unless-stopped

    ports:
      - "3489:3489"

    environment:
      NODE_ENV: production
      VIDEO_REVIEW_LOCAL_ROOTDIR: /storage
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview

    volumes:
      - ${DOCKER_HOST_STORAGE:-videoreview-storage}:/storage
      # Holds the key that encrypts integration tokens; back it up apart from the database.
      - videoreview-secrets:/app/secrets

    depends_on:
      db:
        condition: service_healthy

  video-processing:
    env_file:
      - path: .env
        required: false

    image: ghcr.io/arita-yuto/video-review/video-processing:${VIDEO_REVIEW_VERSION:-latest}
    container_name: video-processing
    restart: unless-stopped

    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /storage
    
    volumes:
      - ${DOCKER_HOST_STORAGE:-videoreview-storage}:/storage

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: videoreview-db
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: videoreview
      POSTGRES_PASSWORD: videoreview
      POSTGRES_DB: videoreview

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "videoreview", "-d", "videoreview"]
      interval: 2s
      retries: 30

    volumes:
      - videoreview-db:/var/lib/postgresql/data

  smtp:
    image: boky/postfix
    container_name: videoreview-smtp
    restart: unless-stopped
    profiles: [smtp]

    environment:
      HOSTNAME: "videoreview.local"
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAYHOST_PASSWORD:-}

  # TLS in front of the app: docker compose --profile https up -d
  # Needs certs/fullchain.pem and certs/privkey.pem; see documents/build.run/https-guide.md.
  nginx:
    image: nginx:1.30
    container_name: videoreview-nginx
    restart: unless-stopped
    profiles: [https]

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/videoreview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - videoreview

volumes:
  videoreview-storage:
  videoreview-db:
  videoreview-secrets:
