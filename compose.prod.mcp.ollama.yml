services:
  videoreview:
    environment:
      VIDEO_REVIEW_MCP_URL: http://mcp:3490/mcp

  mcp:
    env_file:
      - .env

    image: videoreview-mcp:latest
    container_name: videoreview-mcp
    restart: unless-stopped

    environment:
      VIDEO_REVIEW_SERVER_URL: http://videoreview:3489

    ports:
      - "3490:3490"

    depends_on:
      - videoreview

  ollama:
    image: ollama/ollama:latest
    container_name: videoreview-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ${DOCKER_HOST_LLM_MODELS:-videoreview-llm-models}:/root/.ollama/models

volumes:
  videoreview-llm-models:
