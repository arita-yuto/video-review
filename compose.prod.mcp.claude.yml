services:
  videoreview:
    environment:
      VIDEO_REVIEW_MCP_URL: http://mcp:3490/mcp

  mcp:
    env_file:
      - .env

    image: videoreview-mcp:latest
    container_name: videoreview-mcp
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_VIDEO_REVIEW_USE_AI_SUPPORT: "true"
      VIDEO_REVIEW_SERVER_URL: http://videoreview:3489
      VIDEO_REVIEW_LLM_PROVIDER: claude
      # VIDEO_REVIEW_LLM_API_KEY and VIDEO_REVIEW_LLM_MODEL are loaded from .env

    ports:
      - "3490:3490"

    depends_on:
      - videoreview
